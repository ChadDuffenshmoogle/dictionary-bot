# fly.toml app configuration file for Discord bot
app = "dictionary-bot"
primary_region = "ord"  # Chicago region (close to NIU)

[build]
  # Dockerfile in repo root is used automatically

[env]
  # Non-secret env vars here if needed

[processes]
  worker = "python -m src.main"

[deploy]
  strategy = "immediate"

[placement]
  regions = ["ord"]

# No [http_service] or [[services]] -- this bot doesn't serve HTTP traffic,
# and a plain worker process with no service block isn't subject to Fly's
# idle-based auto-stop/suspend logic at all.
